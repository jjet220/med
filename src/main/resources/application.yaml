spring:
  profiles:
    active: main
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.127.126.26:5432/med
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: none
    database: POSTGRESQL
    show-sql: true
  liquibase:
    enabled: true
    drop-first: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: medic
  logging:
    level:
      root: INFO
      com.medical.med: DEBUG
      org.springframework: WARN
      org.hibernate: WARN
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"
    file:
      name: logs/medical-app.log
      max-size: 10MB
      max-history: 30
app:
  database:
    schema: medic